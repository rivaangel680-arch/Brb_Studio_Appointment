  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="profile">

  <!-- ===== SIDEBAR (name and photo are loaded from the database by staff.js) ===== -->

    <div>
      <div class="profile active" onclick="location.href='staff_profile.html'">
        <img id="sidePic" src="" alt="Staff Profile">
        <div><b id="sideName">Staff</b><span>STAFF</span></div>
      </div>
      <a class="nav-item" href="staff_dashboard.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
      <a class="nav-item" href="staff_clients.html"><i class="fa-solid fa-users"></i><span>Client Management</span></a>
      <a class="nav-item" href="staff_calendar.html"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
      <a class="nav-item" href="staff_appointments.html"><i class="fa-solid fa-calendar-check"></i><span>Appointment & Booking</span></a>
      <a class="nav-item" href="staff_attendance.html"><i class="fa-solid fa-clipboard-check"></i><span>Attendance</span></a>
      <a class="nav-item" href="staff_reports.html"><i class="fa-solid fa-star"></i><span>Report</span></a>
      <a class="nav-item" href="../logout.php" style="margin-top:16px;color:#d1d5db"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </div>
    <div class="brand"><big>BRB</big><small>STUDIOS</small></div>
  </aside>

  <!-- ===== PAGE CONTENT ===== -->
  <main>
    <div class="narrow"><h1 class="center">Staff Profile</h1>
    <div class="card ok mb center" id="flash" hidden></div>
    <div class="card err mb" id="errBox" hidden></div>
      <div class="card">
        <div class="center mb"><img id="pPic" alt="Staff Picture" style="width:160px;height:160px;border-radius:50%;object-fit:cover;border:4px solid #d1d5db">
          <h2 style="margin-top:12px" id="pName"></h2><p class="muted">Staff Member</p></div>
        <hr style="border:0;border-top:1px solid #e5e7eb;margin-bottom:28px">
        <h2 style="font-size:22px">Edit Profile</h2>
        <form id="detailsForm" style="margin-bottom:28px"><div class="formgrid" style="align-items:start">
          <div><label>First Name</label><input class="full" name="first_name"></div><div><label>Last Name</label><input class="full" name="last_name"></div></div>
          <label>Username</label><input class="full" name="username" required><label>Email</label><input class="full" type="email" name="email" required>
          <button class="btn btn-black" style="margin-top:16px"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button></form>
        <hr style="border:0;border-top:1px solid #e5e7eb;margin-bottom:28px">
        <form id="passForm" style="margin-bottom:28px"><label>Current Password</label><input class="full" type="password" name="current_password" required>
          <label>New Password</label><input class="full" type="password" name="new_password" required><label>Confirm Password</label><input class="full" type="password" name="confirm_password" required>
          <button class="btn btn-black" style="margin-top:16px"><i class="fa-solid fa-lock"></i> Change Password</button></form>
        <hr style="border:0;border-top:1px solid #e5e7eb;margin-bottom:24px">
        <form id="picForm"><label>Change Picture</label><input type="file" name="profile_pic" accept="image/*" class="full" style="font-size:15px" required>
          <button class="btn btn-outline full" style="margin-top:12px"><i class="fa-solid fa-image"></i> Upload New Picture</button></form>
      </div></div>
  </main>

  <script src="staff.js"></script>
</body>
</html>
