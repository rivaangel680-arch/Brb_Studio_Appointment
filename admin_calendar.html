</head>
<body data-page="calendar">

      <div class="profile" onclick="location.href='admin_profile.html'">
        <img id="adminPic" src="../uploads/profile_default.png" alt="Admin Profile">
        <div><b id="adminName">Admin</b><span>ADMIN</span></div>
      </div>
      <a class="nav-item" href="admin_dashboard.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
      <a class="nav-item" href="admin_clients.html"><i class="fa-solid fa-users"></i><span>Client Management</span></a>
      <a class="nav-item" href="admin_services.html"><i class="fa-solid fa-scissors"></i><span>Service Management</span></a>
      <a class="nav-item" href="admin_charts.html"><i class="fa-solid fa-chart-simple"></i><span>Client Chart</span></a>
      <a class="nav-item" href="admin_appointments.html"><i class="fa-solid fa-calendar-check"></i><span>Appointment & Booking</span></a>
      <a class="nav-item active" href="admin_calendar.html"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
      <a class="nav-item" href="admin_records.html"><i class="fa-solid fa-folder-open"></i><span>Records & Audit</span></a>
      <a class="nav-item" href="admin_attendance.html"><i class="fa-solid fa-clipboard-check"></i><span>Attendance</span></a>

    </div>
    <div class="brand"><big>BRB</big><small>STUDIOS</small></div>
  </aside>

  <!-- ===== PAGE CONTENT ===== -->
  <main>
    <div class="row between mb"><h1 style="margin:0" id="calTitle"></h1>
      <div class="row">
        <button class="btn btn-black" data-act="prev-month"><i class="fa-solid fa-chevron-left"></i></button>
        <select id="monthSelect"></select>
        <button class="btn btn-black" data-act="next-month"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="btn btn-outline" data-act="this-month">Today</button>
      </div></div>
    <div class="card ok mb center" id="flash" hidden></div>
    <div class="card err mb" id="errBox" hidden></div>
    <form class="card row mb" id="offForm">
      <div><label style="margin-top:0">Mark Unavailable Date</label><input type="date" name="date" required></div>
      <div style="flex:1"><label style="margin-top:0">Reason (Optional)</label><input class="full" name="reason" placeholder="e.g., Holiday"></div>
      <button class="btn btn-black" style="align-self:end">Set Unavailable</button>
    </form>
    <div class="card"><div class="cal" id="cal"></div></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
