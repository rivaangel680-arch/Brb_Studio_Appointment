  <!-- ===== PAGE CONTENT ===== -->
  <main>
    <div class="narrow"><h1 class="center">Edit Admin Profile</h1>
    <div class="card ok mb center" id="flash" hidden></div>
    <div class="card err mb" id="errBox" hidden></div>
      <div class="card mb"><h2>Profile Picture</h2>
        <form id="uploadForm"><div class="row mb"><img id="preview" src="../uploads/profile_default.png" style="width:112px;height:112px;border-radius:50%;object-fit:cover;border:2px solid #d1d5db" alt="">
          <div style="flex:1"><input type="file" name="profile_pic" accept="image/*" class="full" style="font-size:15px" required>
          <p class="muted small" style="margin-top:8px">JPG, PNG, GIF, WEBP or BMP. Max 10 MB.</p></div></div>
          <button class="btn btn-black"><i class="fa-solid fa-upload"></i> Upload Picture</button></form></div>
      <div class="card"><h2>Username & Password</h2>
      <form id="credsForm"><label>Username</label><input class="full" name="username" required>
        <label>New Password</label><input class="full" type="password" name="password" placeholder="Leave blank to keep current password">
        <label>Confirm New Password</label><input class="full" type="password" name="password2" placeholder="Re-enter new password">
        <div class="row" style="margin-top:18px"><a class="btn btn-outline" href="admin_profile.html">Cancel</a><button class="btn btn-black"><i class="fa-solid fa-save"></i> Save Changes</button></div></form>
      </div></div>
  </main>

  <script src="app.js"></script>
