  <main>
    <h1>Appointment & Booking Requests</h1>
    <div class="card ok mb center" id="flash" hidden></div>
    <div class="card err mb" id="errBox" hidden></div>
    <div id="list"></div>

    <!-- Reschedule modal -->
    <div id="modal" class="modal"><div class="card">
      <h2>Reschedule Appointment</h2>
      <form id="rescheduleForm">
        <label>New Date</label><input class="full" type="date" name="date" required>
        <label>New Time</label><input class="full" type="time" name="time" required>
        <label>Reason (Optional)</label><textarea class="full" name="reason" rows="3" placeholder="Reason for rescheduling..."></textarea>
        <div class="row" style="justify-content:flex-end;margin-top:18px">
          <button type="button" class="btn btn-outline" data-act="close-modal">Cancel</button><button class="btn btn-black">Reschedule</button>
        </div>
      </form>
    </div></div>
  </main>
